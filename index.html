<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SmartTools Pro — Gestão Acadêmica</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #0f172a; --accent: #2563eb; --whatsapp: #25D366;
            --danger: #ef4444; --bg: #f1f5f9; --card: #ffffff;
            --border: #e2e8f0; --warning: #f59e0b;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding-top: 90px; color: #334155; }
        
        #safety-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 75px;
            background: #1e293b; color: white; display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 1000; font-weight: bold; transition: background 0.5s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #safety-bar.locked { background: var(--danger); }
        #safety-bar.waiting { background: var(--warning); }
        #safety-bar.safe { background: var(--whatsapp); }
        #safety-sub { font-size: 11px; opacity: 0.9; font-weight: normal; margin-top: 2px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; background: #e2e8f0; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: #64748b; transition: 0.2s; }
        .tab-btn.active { background: var(--card); color: var(--accent); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .tab-content { display: none; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tab-content.active { display: block; }

        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-whatsapp { background: var(--whatsapp); color: white; text-decoration: none; font-size: 11px; padding: 6px 10px; border-radius: 4px; }
        .btn-danger { background: var(--danger); color: white; }
        
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .editor-toolbar { background: #f8fafc; padding: 15px; border: 1px solid var(--border); border-radius: 8px 8px 0 0; border-bottom: none; }
        textarea#msg_template { border-radius: 0 0 8px 8px; border-top: 1px solid var(--border); margin-top: 0; min-height: 120px; }

        .table-wrap { overflow-x: auto; max-height: 550px; border: 1px solid var(--border); border-radius: 8px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8fafc; padding: 12px; text-align: left; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid var(--border); color: #475569; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

    <div id="safety-bar" class="safe">
        <div id="safety-main">✅ SISTEMA PRONTO</div>
        <div id="safety-sub">Monitoramento de segurança ativo</div>
    </div>

    <div class="container">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('tab-import')">1. Configurar & Importar</button>
            <button class="tab-btn" onclick="switchTab('tab-manage')">2. Gestão & Disparos</button>
        </div>

        <div id="tab-import" class="tab-content active">
            <h2>Configurar Campanha</h2>
            <div class="editor-toolbar">
                <small style="font-weight: bold; color: #64748b;">Use: [NOME] [UNIDADE] [CURSO] e {Oi|Olá} para variar.</small>
            </div>
            <textarea id="msg_template" placeholder="Digite sua mensagem...">{Olá|Oi} [NOME], referente à matrícula no curso [CURSO] da unidade [UNIDADE]. {Podemos conversar?|Tudo bem?}</textarea>
            
            <div style="background: #f8fafc; padding: 20px; margin-top: 15px; border: 2px dashed #cbd5e1; text-align: center;">
                <input type="file" id="csv_file" accept=".csv">
                <p style="font-size: 12px; color: #64748b; margin-top: 5px;">CSV: RA; Nome; Telefone; Unidade; Curso; Tipo</p>
            </div>
            <button onclick="processCSV()" class="btn btn-primary" style="width: 100%; margin-top: 20px; justify-content: center;">🚀 Processar (A-Z) e Sincronizar</button>
        </div>

        <div id="tab-manage" class="tab-content">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px;">
                <input type="text" id="search_term" placeholder="🔍 Buscar Nome ou RA..." onkeyup="renderTable()">
                <select id="f_unidade" onchange="renderTable()"><option value="">Todas Unidades</option></select>
                <select id="f_status" onchange="renderTable()">
                    <option value="">Todos Status</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Enviado">Enviado</option>
                </select>
                <button onclick="bulkDelete()" class="btn btn-danger" style="font-size: 12px;">🗑️ Limpar Lista</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th width="30"><input type="checkbox" onclick="toggleAll(this)"></th>
                            <th>RA / ID</th>
                            <th>Nome (A-Z)</th>
                            <th>Unidade</th>
                            <th>Curso</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="table_body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Configuração Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDiZQeKce5CUFGrY7UpkyZzBvem-5PFo1Y",
            authDomain: "disparador-ddb0c.firebaseapp.com",
            projectId: "disparador-ddb0c",
            storageBucket: "disparador-ddb0c.firebasestorage.app",
            messagingSenderId: "158046191374",
            appId: "1:158046191374:web:80d6fb6888f64ded4de15f",
            measurementId: "G-4JZPJ3YDFL"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Parâmetros de Segurança
        const MAX_DIARIO = 100;
        const BATCH_SIZE = 15;
        const MIN_DELAY = 45;
        const MAX_DELAY = 120;
        const LONG_PAUSE_MIN = 20;

        let rawData = [];
        let isLocked = false;
        let sessionCount = 0;
        let dailyCount = parseInt(localStorage.getItem('dailyCount')) || 0;
        let lastDate = localStorage.getItem('lastDate') || new Date().toLocaleDateString();

        if (lastDate !== new Date().toLocaleDateString()) {
            dailyCount = 0;
            localStorage.setItem('dailyCount', 0);
            localStorage.setItem('lastDate', new Date().toLocaleDateString());
        }

        // --- FUNÇÃO DO BIP SONORO (DISCRETO) ---
        function playSuccessBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine'; // Som suave
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Nota Lá (A5)
                
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); // Volume bem baixo/discreto
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch (e) { console.log("Áudio não suportado ou bloqueado pelo browser."); }
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');
            if(id !== 'tab-import') loadFromFirebase();
        }

        function spinText(text) {
            return text.replace(/\{([^{}]+)\}/g, (match, content) => {
                const choices = content.split('|');
                return choices[Math.floor(Math.random() * choices.length)];
            });
        }

        async function processCSV() {
            const file = document.getElementById('csv_file').files[0];
            const template = document.getElementById('msg_template').value;
            if(!file) return alert("Selecione o CSV.");

            const reader = new FileReader();
            reader.readAsText(file, 'ISO-8859-1'); 
            
            reader.onload = async function(e) {
                const lines = e.target.result.split(/\r?\n/);
                let batchData = [];
                
                lines.forEach((line, i) => {
                    if(i === 0 || !line.trim()) return;
                    const c = line.split(';');
                    if(c.length >= 5) {
                        const tel = c[2].replace(/\D/g,'');
                        let msg = template.replace('[NOME]', c[1]).replace('[UNIDADE]', c[3]).replace('[CURSO]', c[4]);
                        msg = spinText(msg) + '\u200B'.repeat(Math.floor(Math.random()*5));
                        
                        batchData.push({
                            id: c[0].trim(), nome: c[1].trim(), telefone: tel, unidade: c[3].trim(), 
                            curso: c[4].trim(), status: 'Pendente', 
                            link: `https://wa.me/${tel.startsWith('55')?tel:'55'+tel}?text=${encodeURIComponent(msg)}`,
                            selected: false, timestamp: Date.now()
                        });
                    }
                });

                batchData.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));
                if(batchData.length) await saveToFirebase(batchData);
            };
        }

        async function saveToFirebase(data) {
            const btn = document.querySelector('[onclick="processCSV()"]');
            btn.innerText = "⏳ Sincronizando...";
            try {
                for (const item of data) {
                    await db.collection("contatos").doc(item.id).set(item);
                }
                alert("Importação A-Z concluída!");
                btn.innerText = "🚀 Processar e Sincronizar";
                switchTab('tab-manage');
            } catch (error) {
                alert("Erro: " + error.message);
                btn.innerText = "🚀 Processar e Sincronizar";
            }
        }

        async function loadFromFirebase() {
            const snap = await db.collection("contatos").get();
            rawData = snap.docs.map(doc => doc.data());
            rawData.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));
            updateFilters();
            renderTable();
            updateSafetyUI();
        }

        function updateFilters() {
            const units = [...new Set(rawData.map(i => i.unidade))].sort();
            const el = document.getElementById('f_unidade');
            el.innerHTML = '<option value="">Todas Unidades</option>';
            units.forEach(u => el.innerHTML += `<option value="${u}">${u}</option>`);
        }

        function renderTable() {
            const fUni = document.getElementById('f_unidade').value;
            const fStat = document.getElementById('f_status').value;
            const search = document.getElementById('search_term').value.toLowerCase();
            const tbody = document.getElementById('table_body');
            tbody.innerHTML = '';
            
            rawData.filter(i => {
                return (!fUni || i.unidade === fUni) && (!fStat || i.status === fStat) && 
                       (!search || i.nome.toLowerCase().includes(search) || i.id.toLowerCase().includes(search));
            }).forEach(item => {
                const tr = document.createElement('tr');
                tr.style.background = item.status === 'Enviado' ? '#fffbeb' : 'white';
                tr.innerHTML = `
                    <td><input type="checkbox" ${item.selected?'checked':''} onchange="toggleSelect('${item.id}')"></td>
                    <td>${item.id}</td>
                    <td>${item.nome}</td>
                    <td>${item.unidade}</td>
                    <td>${item.curso}</td>
                    <td><a href="${item.link}" target="_blank" class="btn btn-whatsapp" onclick="handleSend('${item.id}')">📱 ENVIAR</a></td>`;
                tbody.appendChild(tr);
            });
        }

        async function handleSend(id) {
            if (isLocked) { event.preventDefault(); return alert("Segurança ativa! Aguarde."); }
            if (dailyCount >= MAX_DIARIO) { event.preventDefault(); return alert("Limite diário atingido!"); }

            sessionCount++;
            dailyCount++;
            localStorage.setItem('dailyCount', dailyCount);
            
            await db.collection("contatos").doc(id).update({status: 'Enviado'});
            loadFromFirebase();
            
            isLocked = true;
            const bar = document.getElementById('safety-bar');
            let isLong = sessionCount % BATCH_SIZE === 0;
            let secondsWait = isLong ? (LONG_PAUSE_MIN * 60) : (Math.floor(Math.random() * (MAX_DELAY - MIN_DELAY + 1)) + MIN_DELAY);

            bar.className = isLong ? 'waiting' : 'locked';
            let t = secondsWait;
            const int = setInterval(() => {
                const m = Math.floor(t / 60), s = t % 60;
                document.getElementById('safety-main').innerText = isLong ? `☕ PAUSA: ${m}m ${s}s` : `⏳ PRÓXIMO: ${t}s`;
                updateSafetyUI();
                
                if (t-- <= 0) {
                    clearInterval(int);
                    isLocked = false;
                    bar.className = 'safe';
                    document.getElementById('safety-main').innerText = "✅ SISTEMA PRONTO";
                    playSuccessBeep(); // <--- Toca o bip ao liberar
                }
            }, 1000);
        }

        function updateSafetyUI() {
            document.getElementById('safety-sub').innerText = `Hoje: ${dailyCount}/${MAX_DIARIO} | Sessão: ${sessionCount}`;
        }

        function toggleSelect(id) { const i = rawData.find(x => x.id === id); if(i) i.selected = !i.selected; }
        function toggleAll(src) { rawData.forEach(i => i.selected = src.checked); renderTable(); }
        async function bulkDelete() { if(confirm("Limpar lista?")) { for(const i of rawData) await db.collection("contatos").doc(i.id).delete(); loadFromFirebase(); } }

        window.onload = loadFromFirebase;
    </script>
</body>
</html>
